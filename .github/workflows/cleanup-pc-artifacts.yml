name: Retain only two recent Windows portable artifacts

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cleanup-pc-artifacts.yml'
  schedule:
    - cron: '43 4 * * 0'

permissions:
  actions: write
  contents: read

jobs:
  prune-portable-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Remove redundant portable builds, keep two newest
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {owner, repo, per_page: 100}
            );
            const portable = artifacts
              .filter(a => a.name === 'MerylMoviesBox-PC-Portable' && !a.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const retained = portable.slice(0, 2);
            const redundant = portable.slice(2);
            for (const a of redundant) {
              await github.rest.actions.deleteArtifact({
                owner, repo, artifact_id: a.id
              });
              core.info(`Deleted duplicate portable artifact ${a.id} (${a.size_in_bytes} bytes)`);
            }
            const removedBytes = redundant.reduce((sum, a) => sum + a.size_in_bytes, 0);
            core.info(`Kept ${retained.length} most recent portable builds; deleted ${redundant.length} older builds; freed approximately ${(removedBytes / 1048576).toFixed(1)} MiB. All other artifact names and repository files were left untouched.`);
