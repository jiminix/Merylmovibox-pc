name: Déployer MerylMoviBox V3 sur Firebase Hosting

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: merylmovibox-v3-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: v3-hosting
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3/web
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Installer et vérifier la V3
        run: |
          npm ci
          npm test
          npm run build
      - name: Authentification Google Cloud sans clé (GitHub OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/852912622990/locations/global/workloadIdentityPools/merylmovibox-github-v3/providers/github
          service_account: merylmovibox-v3-deploy@merylmovibox.iam.gserviceaccount.com
      - name: Publier uniquement le site Firebase V3
        run: npx --yes firebase-tools@14.25.1 deploy --only hosting:merylmovibox --project merylmovibox --non-interactive
